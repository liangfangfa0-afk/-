name: Publish MotionGuard v1.71

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified APK from private OTA repository
        env:
          GH_TOKEN: ${{ secrets.MOTIONGUARD_OTA_READ_TOKEN }}
        run: |
          set -euo pipefail
          gh run download 41761811128 \
            --repo liangfangfa0-afk/MotionGuardOTA \
            --name motionguard-apk \
            --dir dist
          test -f dist/app-debug.apk
          cp dist/app-debug.apk dist/MotionGuard-v1.71.apk

      - name: Verify APK checksum
        run: |
          set -euo pipefail
          echo "e0cec14c70c0bde53ebf5846cb4f84c4675cea5be4ed0a1472a5d53b2524046d  dist/MotionGuard-v1.71.apk" | sha256sum --check -

      - name: Create public GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.71 dist/MotionGuard-v1.71.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target 2bfcfc41998dc0b8cdc527ca2222bf064f3dfb3a \
            --title "MotionGuard v1.71" \
            --notes-file RELEASE_NOTES_v1.71.md
