name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f 2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match app version $APP_VERSION"
            exit 1
          fi

      - name: Build APK once
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/MotionGuard-${GITHUB_REF_NAME}.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MotionGuard ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
